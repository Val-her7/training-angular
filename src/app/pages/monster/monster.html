<form [formGroup]="formGroup" (submit)="submit($event)">
    <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" formControlName="name">
        @if(isFieldValid('name')) {
            <div class="error">This field is required.</div>
        }
    </div>
    <div class="form-field">
        <label for="hp">HP</label>
        <input type="text" id="hp" name="hp" formControlName="hp">
        @if(isFieldValid('hp')) {
            <div class="error">This field is invalid.</div>
        }
    </div>
    <div class="form-field">
        <label for="hp">Type</label>
        <input type="text" id="type" name="type" formControlName="type">
        @if(isFieldValid('type')) {
            <div class="error">This field is invalid.</div>
        }
    </div>
    <button type="submit" [disabled]="formGroup.get('name')?.invalid || formGroup.get('hp')?.invalid">Save</button>
</form>
